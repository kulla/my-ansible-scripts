---
- tags: [basic]
  block:
    - name: Install basic command line tools
      package:
        name:
          - ripgrep
          - tree
          - htop
          - curl
          - wget
          - inotify-tools
          - ssh
          - gnupg
          - encfs
          - gparted
          - ecryptfs-utils
        state: present

    #- include_tasks: add_language_support.yml lang={{ item }}
    #  with_items: [de, it, en]

    - name: Deinstall Qlipper
      package: name=qlipper state=absent

    - name: Configure the bash
      copy:
        src: configure_bash.sh
        dest: "{{ shell_conf_dir }}/bash"
        mode: 0700
        owner: "{{ user.name }}"
        group: "{{ user.group }}"

    - name: Configure update-manager
      copy:
        src: release-upgrades
        dest: /etc/update-manager/release-upgrades
